<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C5CE7"/>
      <stop offset="50%" stop-color="#5443D6"/>
      <stop offset="100%" stop-color="#2D1BA4"/>
    </linearGradient>

    <!-- Arrow & Speed Gold Gradient -->
    <linearGradient id="arrowGold" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#FFA502"/>
      <stop offset="50%" stop-color="#FFD32A"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Speed Cyan Streak -->
    <linearGradient id="speedCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00CEC9" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00CEC9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#81ECEC" stop-opacity="1"/>
    </linearGradient>

    <!-- Page Gradients with 3D Depth -->
    <linearGradient id="leftPage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#ECEBFF"/>
      <stop offset="100%" stop-color="#D9D5FF"/>
    </linearGradient>

    <linearGradient id="rightPage" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#ECEBFF"/>
      <stop offset="100%" stop-color="#C5BFFF"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0F0C31" flood-opacity="0.4"/>
    </filter>

    <filter id="arrowGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FFA502" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- App Icon Base: Squircle with inner border -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#bgGrad)" filter="url(#dropShadow)"/>
  <rect x="5.5" y="5.5" width="117" height="117" rx="30.5" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" fill="none"/>

  <!-- ============================================== -->
  <!-- 1. HIZ (SPEED): Dynamic Kinetic Motion Lines   -->
  <!-- ============================================== -->
  <path d="M 16 38 L 44 38" stroke="url(#speedCyan)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 12 48 L 36 48" stroke="url(#speedCyan)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 18 58 L 32 58" stroke="url(#speedCyan)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ============================================== -->
  <!-- 2. KİTAP (BOOK): Elegant Open Pages Base       -->
  <!-- ============================================== -->
  <!-- Left Page (Curved open page with lines) -->
  <path d="M 62 94 C 44 97 28 91 22 83 C 22 62 23 48 22 45 C 32 54 48 57 62 53 Z" 
        fill="url(#leftPage)"/>

  <!-- Left Page Reading Lines (Subtle Knowledge Marks) -->
  <line x1="31" y1="62" x2="52" y2="64" stroke="#6C5CE7" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
  <line x1="31" y1="71" x2="48" y2="73" stroke="#6C5CE7" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
  <line x1="33" y1="80" x2="44" y2="81" stroke="#6C5CE7" stroke-width="2" stroke-linecap="round" opacity="0.25"/>

  <!-- Right Page (Curved open page facing forward) -->
  <path d="M 66 94 C 84 97 100 91 106 83 C 106 62 105 48 106 45 C 96 54 80 57 66 53 Z" 
        fill="url(#rightPage)"/>

  <!-- Right Page Reading Lines -->
  <line x1="76" y1="64" x2="97" y2="62" stroke="#6C5CE7" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
  <line x1="80" y1="73" x2="97" y2="71" stroke="#6C5CE7" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
  <line x1="84" y1="81" x2="95" y2="80" stroke="#6C5CE7" stroke-width="2" stroke-linecap="round" opacity="0.25"/>

  <!-- Book Spine Center Fold (Binding) -->
  <path d="M 62 53 Q 64 55 66 53 L 66 94 Q 64 96 62 94 Z" fill="#4834D4"/>

  <!-- ============================================== -->
  <!-- 3. OK (ARROW) + HIZ (SPEED): Surging Forward   -->
  <!-- ============================================== -->
  <!-- Dynamic Supersonic Arrow piercing upward through the book -->
  <g filter="url(#arrowGlow)">
    <!-- Arrow Tail + Head Silhouette -->
    <path d="M 64 22 
             L 86 52 
             L 72 50 
             L 72 78 
             L 56 78 
             L 56 50 
             L 42 52 
             Z" 
          fill="url(#arrowGold)" 
          stroke="#FFFFFF" 
          stroke-width="2" 
          stroke-linejoin="round"/>
          
    <!-- Core Speed Energy Ridge (Center 3D Bevel) -->
    <path d="M 64 22 L 64 78" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Speed Shockwave / Halo Accent above Arrow -->
  <path d="M 52 26 Q 64 16 76 26" stroke="#00CEC9" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9"/>
  <circle cx="64" cy="18" r="2.5" fill="#FFFFFF"/>
</svg>
